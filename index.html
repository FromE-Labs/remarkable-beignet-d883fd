<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<noscript><meta http-equiv="refresh" content="0; url=/es/"></noscript>
<title>From E™ ONE</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#06080b;color:#f5f7fa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .box{text-align:center;padding:40px}
  a{color:#2ca9ff;text-decoration:none;margin:0 8px}
  p{color:#a6b0ba;font-size:14px}
</style>
<script>
(function () {
  var supported = ['es', 'en', 'fr'];
  var target = null;
  try {
    var stored = localStorage.getItem('frome_lang');
    if (stored && supported.indexOf(stored) !== -1) target = stored;
  } catch (e) {}
  if (!target) {
    var nav = ((navigator.language || navigator.userLanguage || 'es') + '').toLowerCase();
    if (nav.indexOf('en') === 0) target = 'en';
    else if (nav.indexOf('fr') === 0) target = 'fr';
    else target = 'es';
  }
  location.replace('/' + target + '/' + location.search + location.hash);
})();
</script>
</head>
<body>
  <div class="box">
    <p>From E™ ONE</p>
    <noscript><p>Select your language:</p></noscript>
    <a href="/es/">ES — Español</a>
    <a href="/en/">EN — English</a>
    <a href="/fr/">FR — Français</a>
  </div>
</body>
</html>
